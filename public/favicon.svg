<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="512" height="512">
  <defs>
    <linearGradient id="bg-grad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#090E1A" />
      <stop offset="50%" stop-color="#111B30" />
      <stop offset="100%" stop-color="#0284C7" />
    </linearGradient>
    <linearGradient id="train-grad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#00C6FF" />
      <stop offset="100%" stop-color="#00F2FE" />
    </linearGradient>
    <filter id="glow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="10" result="blur" />
      <feComposite in="SourceGraphic" in2="blur" operator="over" />
    </filter>
  </defs>

  <!-- Background rounded badge -->
  <rect width="512" height="512" rx="120" fill="url(#bg-grad)" />
  <rect width="496" height="496" x="8" y="8" rx="112" fill="none" stroke="#00F2FE" stroke-width="12" stroke-opacity="0.5" />

  <!-- Railway Track Lines -->
  <path d="M 120 420 L 220 340 M 392 420 L 292 340" stroke="#00F2FE" stroke-width="18" stroke-linecap="round" stroke-opacity="0.4" />
  <line x1="160" y1="390" x2="352" y2="390" stroke="#00F2FE" stroke-width="14" stroke-linecap="round" stroke-opacity="0.4" />

  <!-- High Speed Train Body -->
  <g filter="url(#glow)">
    <!-- Main Engine Shell -->
    <rect x="136" y="96" width="240" height="250" rx="60" fill="url(#train-grad)" />
    
    <!-- Windshield -->
    <path d="M 166 140 Q 256 120 346 140 L 336 210 Q 256 195 176 210 Z" fill="#090E1A" />
    
    <!-- Center Line Divider -->
    <line x1="256" y1="130" x2="256" y2="200" stroke="#00F2FE" stroke-width="6" stroke-linecap="round" />

    <!-- Headlights -->
    <circle cx="186" cy="285" r="22" fill="#FFFFFF" />
    <circle cx="186" cy="285" r="30" fill="#00F2FE" opacity="0.4" />

    <circle cx="326" cy="285" r="22" fill="#FFFFFF" />
    <circle cx="326" cy="285" r="30" fill="#00F2FE" opacity="0.4" />

    <!-- Train Front Grille -->
    <rect x="216" y="270" width="80" height="30" rx="8" fill="#090E1A" />
    <line x1="236" y1="285" x2="276" y2="285" stroke="#00F2FE" stroke-width="6" stroke-linecap="round" />
  </g>
</svg>